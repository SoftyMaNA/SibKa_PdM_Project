<div class="table-wrap"><table><thead><tr><th>Код техники</th><th>Модель</th><th>Состояние по данным</th><th>Узел с отклонением</th><th>Последнее измерение UTC</th></tr></thead><tbody>{% for e in machines %}<tr><td><a href="{{ url_for('equipment_card',equipment_id=e.id_equipment) }}">{{ e.equipment_code }}</a></td><td>{{ e.manufacturer }} {{ e.model }}</td><td><span class="pill {{ e.condition }}">{{ labels[e.condition] }}</span></td><td>{{ e.problem_nodes or '–' }}</td><td>{{ e.last_at|dt }}</td></tr>{% else %}<tr><td colspan="5">По заданному условию техника не найдена.</td></tr>{% endfor %}</tbody></table></div>
