name: SibKa PdM Tests
on:
  push:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    name: Python unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/ -q --junitxml=unit-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: unit-results.xml
  database:
    name: MariaDB end-to-end tests
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=15
    env:
      PDM_DB_HOST: 127.0.0.1
      PDM_DB_PORT: 3306
      PDM_DB_USER: root
      PDM_DB_PASSWORD: ci-only-password
      PDM_DB_DATABASE: sibka_pdm_ci
      PDM_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Import isolated laboratory schema
        run: python scripts/init_ci_db.py
      - run: python -m pytest tests/test_database_flow.py -q --junitxml=database-results.xml
      - name: Install browser for interface verification
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify browser scenario and capture screens
        run: python scripts/capture_screens.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-test-results
          path: |
            database-results.xml
            docs/lab7/screenshots/
