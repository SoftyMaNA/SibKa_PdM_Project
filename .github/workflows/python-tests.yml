name: Python Tests

on:
  push:
    branches: [main, develop, master, 'test/**', 'feature/**', 'release/**']
  pull_request:
    branches: [main, develop, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12', '3.13']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test telemetry, diagnostics and CLI
        run: >-
          python -m pytest -v
          --junitxml=reports/junit.xml
          --cov=telemetry --cov=diagnostics --cov=main
          --cov-branch --cov-report=term-missing
          --cov-report=xml:reports/coverage.xml
          --cov-report=html:reports/coverage
          --cov-fail-under=90
      - name: Save test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-python-${{ matrix.python-version }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
